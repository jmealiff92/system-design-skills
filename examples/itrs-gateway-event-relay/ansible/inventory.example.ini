# Copy to inventory.ini (kept out of version control if hostnames are
# sensitive) and fill in the real ~80 Gateway hosts. Grouped by region so a
# rollout can be scoped with --limit independently of site.yml's `serial:`
# batching within a run.

[itrs_gateway_us]
gw-us-east-01.example.internal
gw-us-east-02.example.internal

[itrs_gateway_eu]
gw-eu-west-01.example.internal
gw-eu-west-02.example.internal

[itrs_gateway_apac]
gw-apac-01.example.internal

[itrs_gateway_hosts:children]
itrs_gateway_us
itrs_gateway_eu
itrs_gateway_apac
