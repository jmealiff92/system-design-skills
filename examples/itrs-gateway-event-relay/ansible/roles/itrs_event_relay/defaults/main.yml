---
# See ../../README.md for what each of these controls, and
# docs/design/itrs-gateway-event-script.md §2/§4 for where the numeric
# defaults (workers, queue size, timeouts, breaker thresholds) come from.

# The single system account both binaries run as. itrs-notify's runtime
# identity isn't actually chosen here — Geneos forks it as part of the
# Gateway's own process tree, so it always runs as whatever user Geneos's
# Effects already run as. Setting itrs_relay_user to that SAME account
# (rather than creating a separate dedicated account for the daemon) is
# what keeps this single-user: no shared group, no setgid directory, no
# cross-user permission plumbing — see tasks/main.yml.
#
# CONFIRM THIS matches the real account before rollout (must already
# exist — see itrs_relay_manage_user below). The placeholder here is a
# guess, not a default worth deploying as-is.
itrs_relay_user: geneos
itrs_relay_group: geneos

# Leave false (the expected case): the Geneos install already created
# this account, and this role only needs to use it, not own its lifecycle.
# Set true only if this account doesn't exist yet and this role should
# create it — see tasks/main.yml's guarded user/group tasks.
itrs_relay_manage_user: false

itrs_relay_install_dir: /opt/itrs-event-relay
itrs_notify_install_dir: /opt/itrs-notify

# Single owner now (itrs_relay_user, for both the daemon and itrs-notify's
# disk-fallback writes) — plain 0750, no setgid needed. See tasks/main.yml
# for why this is created explicitly rather than left to systemd's
# StateDirectory= (its default 0750 would've been fine too now that
# there's only one user, but managing it here keeps the path stable
# across a systemd-unit rewrite).
itrs_relay_spool_dir: /var/spool/itrs-event-relay

# Systemd RuntimeDirectory= name -> /run/itrs-event-relay.
itrs_relay_runtime_dir_name: itrs-event-relay

# Built once in CI (see ../../README.md "Build"), not compiled on any of
# the ~80 target hosts — they get a copied static binary, nothing else.
# Expected filenames: event-relay-linux-<goarch>, itrs-notify-linux-<goarch>.
itrs_relay_binaries_dir: "{{ playbook_dir }}/../dist"

itrs_ems_url: "https://ems.internal/api/v1/events"
# Put the real value in group_vars/vault, not here — see ../../README.md.
itrs_ems_token: ""

itrs_relay_workers: 200
itrs_relay_queue_maxsize: 20000
itrs_relay_attempt_timeout_s: 0.15
itrs_relay_max_retries: 1
itrs_relay_breaker_threshold: 20
itrs_relay_breaker_open_s: 5.0
itrs_relay_http2: "0"

# ansible_architecture -> the GOARCH suffix this design's binaries are
# built with (see ../../README.md "Build"). Extend if a region runs
# something else; an unmapped value fails the play rather than silently
# deploying the wrong binary (see tasks/main.yml).
itrs_goarch_map:
  x86_64: amd64
  aarch64: arm64
