---
# Off by default (see defaults/main.yml): the expected case is that
# itrs_relay_user is Geneos's own existing service account, managed by
# whatever installed Geneos, not this role. Only set
# itrs_relay_manage_user: true if that account genuinely doesn't exist yet.
- name: Create the relay group
  ansible.builtin.group:
    name: "{{ itrs_relay_group }}"
    system: true
    state: present
  when: itrs_relay_manage_user

- name: Create the relay system user
  ansible.builtin.user:
    name: "{{ itrs_relay_user }}"
    group: "{{ itrs_relay_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present
  when: itrs_relay_manage_user

- name: Create install directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ itrs_relay_install_dir }}"
    - "{{ itrs_notify_install_dir }}"
    - /etc/itrs-event-relay

# itrs-notify (its disk fallback) and event-relay (crash recovery,
# breaker-open re-spool, rotate/rename during drain) both write here — a
# plain owner-only 0750 is enough because both run as itrs_relay_user.
- name: Create the shared spool directory
  ansible.builtin.file:
    path: "{{ itrs_relay_spool_dir }}"
    state: directory
    owner: "{{ itrs_relay_user }}"
    group: "{{ itrs_relay_group }}"
    mode: "0750"

- name: Map this host's architecture to a GOARCH suffix
  ansible.builtin.set_fact:
    itrs_goarch: "{{ itrs_goarch_map[ansible_architecture] | default(omit) }}"

- name: Fail loudly on an unmapped architecture rather than silently deploying the wrong binary
  ansible.builtin.fail:
    msg: >-
      No itrs_goarch_map entry for ansible_architecture={{ ansible_architecture }}
      on {{ inventory_hostname }}. Add it (and build that GOARCH's binaries)
      before including this host in the rollout.
  when: itrs_goarch is not defined

- name: Deploy the event-relay binary
  ansible.builtin.copy:
    src: "{{ itrs_relay_binaries_dir }}/event-relay-linux-{{ itrs_goarch }}"
    dest: "{{ itrs_relay_install_dir }}/event-relay"
    owner: root
    group: root
    mode: "0755"
  notify: restart itrs-event-relay

- name: Deploy the itrs-notify binary
  ansible.builtin.copy:
    src: "{{ itrs_relay_binaries_dir }}/itrs-notify-linux-{{ itrs_goarch }}"
    dest: "{{ itrs_notify_install_dir }}/itrs-notify"
    owner: root
    group: root
    mode: "0755"
    # No handler/restart: itrs-notify is forked fresh by Geneos on every
    # trigger, so the very next trigger after this copy already runs the
    # new binary. There's no long-running process here to bounce.

- name: Write the EMS token / secrets env file
  ansible.builtin.template:
    src: env.j2
    dest: /etc/itrs-event-relay/env
    owner: "{{ itrs_relay_user }}"
    group: "{{ itrs_relay_group }}"
    mode: "0600"
  notify: restart itrs-event-relay

- name: Install the systemd unit
  ansible.builtin.template:
    src: itrs-event-relay.service.j2
    dest: /etc/systemd/system/itrs-event-relay.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart itrs-event-relay

- name: Enable and start the relay daemon
  ansible.builtin.systemd:
    name: itrs-event-relay
    enabled: true
    state: started
    daemon_reload: true
